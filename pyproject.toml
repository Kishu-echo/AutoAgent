[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-coding-agent"
version = "0.1.0"
description = "A review-first CLI that turns natural language requirements into tested code changes."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
autocode = "autocode.cli:main"

[tool.setuptools.packages.find]
include = ["autocode*"]
